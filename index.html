<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Indfødsret">
<meta name="theme-color" content="#eef0f1">
<title>Indfødsret træning</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23c8102e'/%3E%3Crect x='52' width='22' height='180' fill='white'/%3E%3Crect y='79' width='180' height='22' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef0f1;
    --card: #ffffff;
    --card-2: #fafcfb;
    --border: #e3e9e6;
    --text: #1f2a26;
    --muted: #8a9a93;
    --soft: #f1f4f2;
    --green: #3f9a6b;
    --green-soft: #e9f6ef;
    --green-bar: #5cba86;
    --red: #c94a4a;
    --red-soft: #fcecec;
    --amber: #e3a72f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); min-height: 100vh; }
  .card { max-width: 820px; margin: 0 auto; background: linear-gradient(var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 6px 24px rgba(30,50,40,.06); overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 18px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 500; font-size: 15px; padding: 4px 0; cursor: pointer; }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .pill { background: var(--green-soft); color: var(--green); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .timer { background: var(--soft); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
  .bar { height: 6px; background: var(--soft); }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--green-bar), var(--green)); width: 0; transition: width .3s; }
  main { padding: 22px 18px 26px; }
  .eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 10px; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 22px; font-weight: 700; }
  .opt { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; font: inherit; font-size: 17px; color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
  .opt:active { transform: scale(.995); }
  .opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--soft); color: var(--muted); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .opt.right { border-color: var(--green); background: var(--green-soft); }
  .opt.right .l { background: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); }
  .opt.wrong .l { background: var(--red); color: #fff; }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .55; }
  .feedback { min-height: 24px; font-weight: 600; margin: 6px 2px 14px; }
  .feedback.ok { color: var(--green); } .feedback.no { color: var(--red); }
  .actions { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
  .btn { font: inherit; font-weight: 600; font-size: 17px; border-radius: 14px; padding: 14px 26px; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .4; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 22px; }
  .stat { background: var(--soft); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat.weak b { color: var(--red); } .stat.mid b { color: var(--amber); } .stat.good b { color: var(--green); }
  h2 { font-size: 15px; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .hist { list-style: none; padding: 0; margin: 0; }
  .hist li { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .d { color: var(--muted); }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .big { font-size: 56px; font-weight: 800; text-align: center; margin: 4px 0 2px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .review { border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; font-size: 15px; }
  .review p { margin: 0 0 6px; font-weight: 600; }
  .review .y { color: var(--red); } .review .c { color: var(--green); }
  .empty { color: var(--muted); font-size: 15px; }
  .foot { text-align: center; margin-top: 18px; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  @media (min-width: 640px) { main { padding: 30px 48px 34px; } header { padding: 18px 36px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script src="questions.js"></script>
<script>
(function () {
  const ROUND = 10;
  const KEY = "indf-v1";
  const BOX_WEIGHT = [10, 6, 4, 2, 1]; // box 0 = svag … box 4 = sikker (kommer stadig af og til)
  const Q = window.QUESTIONS || [];
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const app = document.getElementById("app");

  // ---------- storage ----------
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.progress) return s; } catch (e) {}
    return { progress: {}, rounds: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  let state = load();
  function prog(id) {
    if (!state.progress[id]) state.progress[id] = { box: 0, right: 0, wrong: 0, streak: 0 };
    return state.progress[id];
  }

  // ---------- picking ----------
  function weight(q) {
    const p = prog(q.id);
    let w = BOX_WEIGHT[Math.min(p.box, 4)];
    // mange fejl i alt (også fra indfødsretstest.dk) giver lidt ekstra vægt
    w *= 1 + Math.min((p.wrong + (q.misses || 0)) * 0.15, 1);
    return w;
  }
  function pickRound(n) {
    const pool = Q.slice();
    const out = [];
    const last = new Set((state.rounds[0] && state.rounds[0].ids) || []);
    while (out.length < n && pool.length) {
      const ws = pool.map(q => weight(q) * (last.has(q.id) && pool.length > n ? 0.4 : 1));
      let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
      while (i < ws.length - 1 && (r -= ws[i]) > 0) i++;
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const L = "ABCDEFG";
  function counts() {
    let weak = 0, mid = 0, good = 0;
    Q.forEach(q => { const b = prog(q.id).box; if (b <= 1) weak++; else if (b <= 3) mid++; else good++; });
    return { weak, mid, good };
  }
  function fmtDate(t) {
    const d = new Date(t);
    return d.toLocaleDateString("da-DK", { day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
  }
  function fmtTime(s) { const m = Math.floor(s / 60), x = s % 60; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") + ":" + String(x).padStart(2, "0"); }

  // ---------- home ----------
  let timerId = null;
  function home() {
    clearInterval(timerId);
    const c = counts();
    const n = Math.min(ROUND, Q.length);
    const rounds = state.rounds;
    const avg = rounds.length ? (rounds.slice(0, 5).reduce((a, r) => a + r.score / r.total, 0) / Math.min(5, rounds.length) * 10).toFixed(1) : null;
    app.innerHTML = `
      <header><div class="title">Indfødsret <span class="pill">⚡ Mine fejl</span></div>
        <span class="timer">${Q.length} spm.</span></header>
      <div class="bar"><div style="width:${Q.length ? (c.good / Q.length * 100) : 0}%"></div></div>
      <main>
        <p class="eyebrow">Status</p>
        <div class="stats">
          <div class="stat weak"><b>${c.weak}</b><span>Svage</span></div>
          <div class="stat mid"><b>${c.mid}</b><span>På vej</span></div>
          <div class="stat good"><b>${c.good}</b><span>Sikre</span></div>
        </div>
        <button class="btn primary wide" id="start" ${n ? "" : "disabled"}>Start omgang (${n} spørgsmål)</button>
        <h2>Mine omgange${avg ? ` <span style="text-transform:none;letter-spacing:0">· snit sidste 5: ${avg}/10</span>` : ""}</h2>
        ${rounds.length ? `<ul class="hist">${rounds.slice(0, 30).map((r, i) => `
          <li><span>Omgang #${rounds.length - i} <span class="d">· ${fmtDate(r.at)}</span></span>
          <span class="score" style="color:${r.score / r.total >= .8 ? "var(--green)" : r.score / r.total >= .5 ? "var(--amber)" : "var(--red)"}">${r.score}/${r.total}</span></li>`).join("")}</ul>`
          : `<p class="empty">Ingen omgange endnu. Tryk start.</p>`}
        <div class="foot"><button class="link" id="reset">Nulstil fremskridt</button></div>
      </main>`;
    document.getElementById("start").onclick = startRound;
    document.getElementById("reset").onclick = () => {
      if (confirm("Slet al historik og fremskridt?")) { state = { progress: {}, rounds: [] }; save(); home(); }
    };
  }

  // ---------- quiz ----------
  let round = null;
  function startRound() {
    const qs = pickRound(Math.min(ROUND, Q.length));
    round = {
      items: qs.map(q => ({ id: q.id, order: shuffle(q.options.map((_, i) => i)), answer: null })),
      i: 0, start: Date.now()
    };
    clearInterval(timerId);
    timerId = setInterval(() => { const t = document.getElementById("t"); if (t) t.textContent = fmtTime(Math.floor((Date.now() - round.start) / 1000)); }, 1000);
    question();
  }
  function question() {
    const it = round.items[round.i], q = byId[it.id], total = round.items.length, answered = it.answer !== null;
    const p = prog(q.id);
    app.innerHTML = `
      <header><button class="back" id="quit">← Mine prøver</button>
        <span class="pill ${p.box <= 1 ? "red" : ""}">${p.box <= 1 ? "Svag" : p.box <= 3 ? "På vej" : "Sikker"}</span>
        <span class="timer" id="t">${fmtTime(Math.floor((Date.now() - round.start) / 1000))}</span></header>
      <div class="bar"><div style="width:${(round.i + (answered ? 1 : 0)) / total * 100}%"></div></div>
      <main>
        <p class="eyebrow">Spørgsmål ${round.i + 1} af ${total}</p>
        <h1>${esc(q.q)}</h1>
        ${it.order.map((oi, k) => {
          let cls = "";
          if (answered) cls = oi === q.correct ? "right" : oi === it.answer ? "wrong" : "dim";
          return `<button class="opt ${cls}" data-o="${oi}" ${answered ? "disabled" : ""}><span class="l">${L[k]}</span><span>${esc(q.options[oi])}</span></button>`;
        }).join("")}
        <div class="feedback ${answered ? (it.answer === q.correct ? "ok" : "no") : ""}">${answered ? (it.answer === q.correct ? "Rigtigt ✓" : "Forkert. Det rigtige svar er markeret med grønt.") : ""}</div>
        <div class="actions">
          ${answered ? `<button class="btn primary" id="next">${round.i + 1 < total ? "Næste →" : "Se resultat"}</button>` : ""}
        </div>
      </main>`;
    document.getElementById("quit").onclick = () => { if (confirm("Afbryd omgangen? Svar indtil nu er gemt i dit fremskridt.")) home(); };
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.o));
    const nx = document.getElementById("next");
    if (nx) nx.onclick = () => { round.i++; round.i < total ? question() : finish(); };
    window.scrollTo(0, 0);
  }
  function answer(o) {
    const it = round.items[round.i], q = byId[it.id], p = prog(q.id);
    if (it.answer !== null) return;
    it.answer = o;
    if (o === q.correct) { p.right++; p.streak++; p.box = Math.min(p.box + 1, 4); }
    else { p.wrong++; p.streak = 0; p.box = 0; }
    p.last = Date.now();
    save();
    question();
  }
  function finish() {
    clearInterval(timerId);
    const items = round.items, score = items.filter(it => it.answer === byId[it.id].correct).length;
    const secs = Math.floor((Date.now() - round.start) / 1000);
    state.rounds.unshift({ at: Date.now(), score, total: items.length, secs, ids: items.map(i => i.id) });
    save();
    const wrong = items.filter(it => it.answer !== byId[it.id].correct);
    app.innerHTML = `
      <header><button class="back" id="h">← Mine prøver</button><span class="pill">Omgang #${state.rounds.length}</span><span class="timer">${fmtTime(secs)}</span></header>
      <div class="bar"><div style="width:100%"></div></div>
      <main>
        <div class="big" style="color:${score / items.length >= .8 ? "var(--green)" : score / items.length >= .5 ? "var(--amber)" : "var(--red)"}">${score}/${items.length}</div>
        <p class="sub">${score === items.length ? "Alle rigtige!" : `${wrong.length} forkert${wrong.length === 1 ? "" : "e"}. De kommer oftere igen.`}</p>
        ${wrong.map(it => { const q = byId[it.id]; return `<div class="review"><p>${esc(q.q)}</p>
          <div class="y">Dit svar: ${esc(q.options[it.answer])}</div><div class="c">Rigtigt: ${esc(q.options[q.correct])}</div></div>`; }).join("")}
        <div class="actions"><button class="btn" id="h2">Forside</button><button class="btn primary" id="again">Ny omgang</button></div>
      </main>`;
    document.getElementById("h").onclick = home;
    document.getElementById("h2").onclick = home;
    document.getElementById("again").onclick = startRound;
  }

  home();
})();
</script>
</body>
</html>
